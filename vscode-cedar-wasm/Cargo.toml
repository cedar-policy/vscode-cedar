[package]
name = "vscode-cedar-wasm"

version = "0.14.0"
edition = "2021"
rust-version = "1.89"
description = "WASM bindgen bindings for cedar-policy"
license = "Apache-2.0"
homepage = "https://cedarpolicy.com"
repository = "https://github.com/cedar-policy/vscode-cedar"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true }

# cedar
cedar-policy = { version = "=4.15.0" }
cedar-policy-core = { version = "=4.15.0" }
cedar-policy-formatter = { version = "=4.15.0" }
miette = "7.6.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.80"

[build-dependencies]
toml = "0.9"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
codegen-units = 1
